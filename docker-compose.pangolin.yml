# Convex Manager behind Pangolin.
# Everything joins the external `pangolin` network (the one Newt runs on), so no host ports are published:
# Pangolin reaches the manager at http://convex-manager-frontend:80, and project containers
# (backend-<name>:3210/3211, dashboard-<name>:6791) are discovered through their pangolin.* labels.
# Resource creation: set the PANGOLIN_API_* variables below and the manager applies resources through
# the Pangolin API (works with any site type). Otherwise a Newt site needs
# DOCKER_SOCKET=/var/run/docker.sock (and the socket mounted) to pick up the labels.
services:
  manager-db:
    image: postgres:15-alpine
    container_name: convex-manager-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-convex_manager_secret}
      POSTGRES_DB: ${DB_NAME:-convex_manager_db}
    volumes:
      - manager-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - pangolin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-convex_manager_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  manager-backend:
    image: motionninja/convex-manager-backend:latest
    container_name: convex-manager-backend
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=manager-db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-convex_manager_secret}
      - DB_NAME=${DB_NAME:-convex_manager_db}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_change_in_production}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - APP_URL=${APP_URL:-http://localhost:5173}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - EMAIL_FROM=${EMAIL_FROM:-"Convex Manager" <noreply@example.com>}
      - PROJECTS_DIR=/app/projects
      # Project containers join this network so Pangolin can reach them by service name
      - PROJECTS_NETWORK=pangolin
      # Pangolin Integration API: when all four are set, the manager creates/updates/deletes each
      # project's resources itself (blueprint API) instead of relying on Newt reading container labels.
      - PANGOLIN_API_URL=${PANGOLIN_API_URL:-}
      - PANGOLIN_API_KEY=${PANGOLIN_API_KEY:-}
      - PANGOLIN_ORG_ID=${PANGOLIN_ORG_ID:-}
      - PANGOLIN_SITE=${PANGOLIN_SITE:-}
    volumes:
      # Mount the Docker socket so the backend can manage Convex instances
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the projects directory so configurations and data persist
      - ./projects:/app/projects
    depends_on:
      manager-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pangolin

  manager-frontend:
    image: motionninja/convex-manager-frontend:latest
    container_name: convex-manager-frontend
    # Optional: let Newt create the manager resource too, instead of adding it in the Pangolin UI
    # labels:
    #   - "pangolin.public-resources.convex-manager.name=Convex Manager"
    #   - "pangolin.public-resources.convex-manager.mode=http"
    #   - "pangolin.public-resources.convex-manager.full-domain=manager.yourdomain.com"
    #   - "pangolin.public-resources.convex-manager.targets[0].method=http"
    #   - "pangolin.public-resources.convex-manager.targets[0].hostname=convex-manager-frontend"
    #   - "pangolin.public-resources.convex-manager.targets[0].port=80"
    depends_on:
      - manager-backend
    restart: unless-stopped
    networks:
      - pangolin

volumes:
  manager-db-data:

networks:
  pangolin:
    name: pangolin
    external: true
